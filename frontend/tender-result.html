<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n-text="tenderResult.title">نتيجة المناقصة | PharmaLink</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
</head>
<body>
<a href="#main" class="skip-link">تخطي إلى المحتوى</a>
<header id="mobileNav"></header>

<main id="main" class="pl-shell">

  <section class="pl-content">
    <div class="pl-card">
      <p class="pl-eyebrow" data-i18n-text="nav.tenderResult">نتيجة المناقصة</p>
      <h1 class="pl-page-title" id="v-title" data-i18n-text="tenderResult.heading">نتيجة المناقصة</h1>
      <p class="pl-page-sub" data-i18n-text="tenderResult.subtitle">"يعرض ملخصًا لنتيجة عرضك بعد اعتماد قرار الترسية من إدارة المخزن."</p>

      <div id="result-banner" class="result-banner mb-4"></div>

      <div id="items-summary"></div>

      <div class="d-flex justify-content-between flex-wrap gap-2 mt-4">
        <a href="track-status.html" class="btn btn-pl-ghost" data-i18n-text="common.back">رجوع</a>
        <a href="tenders.html" class="btn btn-pl" data-i18n-text="tenderResult.browseOthers">تصفح مناقصات أخرى</a>
      </div>
    </div>
  </section>

  <aside class="pl-sidebar">
    <div class="sb-logo"><img src="img/logo.png" alt="شعار PharmaLink" data-i18n-alt="index.logoAlt"></div>
    <nav>
      <a href="index.html" data-i18n-text="nav.home">الرئيسية</a>
      <a href="tenders.html" data-i18n-text="nav.availableTenders">المناقصات المتاحة</a>
      <a href="tender-detail.html" data-i18n-text="tenderDetail.eyebrow">تفاصيل المناقصة</a>
      <a href="submit-offer.html" data-i18n-text="nav.submitOffer">تقديم العرض</a>
      <a href="track-status.html" data-i18n-text="nav.trackStatus">متابعة حالة المناقصات</a>
      <a href="tender-result.html" class="active" data-i18n-text="nav.tenderResult">نتيجة المناقصة</a>
      <a href="#" class="logout-link" data-i18n-text="common.logout">تسجيل الخروج</a>
    </nav>
  </aside>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script src="js/script.js"></script>
<script>
  requireRole('supplier');

  const rfqId = getRfqIdFromUrl();
  if (!rfqId) window.location.href = 'track-status.html';

  const BANNERS = {
    awarded: { cls: 'result-success', icon: 'bi-trophy-fill', key: 'tenderResult.banner.awarded' },
    rejected: { cls: 'result-danger', icon: 'bi-x-circle-fill', key: 'tenderResult.banner.rejected' },
    submitted: { cls: 'result-pending', icon: 'bi-hourglass-split', key: 'tenderResult.banner.submitted' },
    cancelled: { cls: 'result-danger', icon: 'bi-x-circle-fill', key: 'tenderResult.banner.cancelled' }
  };

  (async function load() {
    try {
      const res = await apiCall('GET', '/quotes?per_page=100');
      const quote = (res.data.data || []).find(q => String(q.rfq_id) === String(rfqId));

      if (!quote) {
        showApiError(t('tenderResult.err.noQuoteFound'));
        return;
      }

      document.getElementById('v-title').textContent = t('tenderResult.headingWithTitle') + quote.rfq.title;

      const banner = BANNERS[quote.status] || BANNERS.submitted;
      document.getElementById('result-banner').className = 'result-banner mb-4 ' + banner.cls;
      document.getElementById('result-banner').innerHTML = `<i class="bi ${banner.icon}"></i><div>${t(banner.key)}</div>`;

      const items = quote.quote_items || [];
      const n = v => Number(v) || 0;
      const total = items.reduce((s, it) => s + (n(it.net_unit_price) || n(it.unit_price)) * (n(it.available_qty) || 1), 0);
      const priceStr = Number.isInteger(total) ? total : total.toFixed(2);
      const maxDays = items.length ? Math.max(...items.map(it => n(it.delivery_days))) : 0;
      const avgDisc = items.length ? Math.round(items.reduce((s, it) => s + n(it.discount_percentage), 0) / items.length) : 0;
      const awardDate = quote.updated_at ? fmtDate(quote.updated_at) : '—';

      document.getElementById('items-summary').innerHTML = `
        <div class="kv-row"><span class="k">${t('tenderResult.tenderName')}</span><span class="v">${escapeHtml(quote.rfq.title)}</span></div>
        <div class="kv-row"><span class="k">${t('tenderResult.yourPrice')}</span><span class="v">${priceStr}$</span></div>
        <div class="kv-row"><span class="k">${t('tenderResult.deliveryTime')}</span><span class="v">${maxDays} ${t('tenderResult.days')}</span></div>
        <div class="kv-row"><span class="k">${t('tenderResult.discountPct')}</span><span class="v">${avgDisc}%</span></div>
        <div class="kv-row"><span class="k">${t('tenderResult.awardDate')}</span><span class="v">${awardDate}</span></div>
      `;
    } catch (err) {
      showApiError(err.message || t('tenderResult.err.loadFailed'));
    }
  })();
</script>
</body>
</html>
