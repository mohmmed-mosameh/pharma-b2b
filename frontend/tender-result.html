<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتيجة المناقصة | PharmaLink</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a href="#main" class="skip-link">تخطي إلى المحتوى</a>
<header id="mobileNav"></header>

<main id="main" class="pl-shell">

  <section class="pl-content">
    <div class="pl-card">
      <p class="pl-eyebrow">نتيجة المناقصة</p>
      <h1 class="pl-page-title" id="v-title">نتيجة المناقصة</h1>
      <p class="pl-page-sub">"يعرض ملخصًا لنتيجة عرضك بعد اعتماد قرار الترسية من إدارة المخزن."</p>

      <div id="result-banner" class="result-banner mb-4"></div>

      <div id="items-summary"></div>

      <div class="d-flex justify-content-between flex-wrap gap-2 mt-4">
        <a href="track-status.html" class="btn btn-pl-ghost">رجوع</a>
        <a href="tenders.html" class="btn btn-pl">تصفح مناقصات أخرى</a>
      </div>
    </div>
  </section>

  <aside class="pl-sidebar">
    <div class="sb-logo"><img src="img/logo.png" alt="شعار PharmaLink"></div>
    <nav>
      <a href="index.html">الرئيسية</a>
      <a href="tenders.html">المناقصات المتاحة</a>
      <a href="tender-detail.html">تفاصيل المناقصة</a>
      <a href="submit-offer.html">تقديم العرض</a>
      <a href="track-status.html">متابعة حالة المناقصات</a>
      <a href="tender-result.html" class="active">نتيجة المناقصة</a>
      <a href="#" class="logout-link">تسجيل الخروج</a>
    </nav>
  </aside>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/script.js"></script>
<script>
  requireRole('supplier');

  const rfqId = getRfqIdFromUrl();
  if (!rfqId) window.location.href = 'track-status.html';

  const BANNERS = {
    awarded: { cls: 'result-success', icon: 'bi-trophy-fill', text: 'مبروك! تم ترسية المناقصة على عرضك المقدَّم' },
    rejected: { cls: 'result-danger', icon: 'bi-x-circle-fill', text: 'لم يقع الاختيار على عرضك هذه المرة' },
    submitted: { cls: 'result-pending', icon: 'bi-hourglass-split', text: 'عرضك لا يزال قيد المراجعة من الصيدلية' },
    cancelled: { cls: 'result-danger', icon: 'bi-x-circle-fill', text: 'تم إلغاء هذا العرض' }
  };

  (async function load() {
    try {
      const res = await apiCall('GET', '/quotes?per_page=100');
      const quote = (res.data.data || []).find(q => String(q.rfq_id) === String(rfqId));

      if (!quote) {
        showApiError('لم يتم العثور على عرض مقدَّم من طرفك على هذه المناقصة.');
        return;
      }

      document.getElementById('v-title').textContent = 'نتيجة المناقصة: ' + quote.rfq.title;

      const banner = BANNERS[quote.status] || BANNERS.submitted;
      document.getElementById('result-banner').className = 'result-banner mb-4 ' + banner.cls;
      document.getElementById('result-banner').innerHTML = `<i class="bi ${banner.icon}"></i><div>${banner.text}</div>`;

      const items = quote.quote_items || [];
      const n = v => Number(v) || 0;
      const total = items.reduce((s, it) => s + (n(it.net_unit_price) || n(it.unit_price)) * (n(it.available_qty) || 1), 0);
      const priceStr = Number.isInteger(total) ? total : total.toFixed(2);
      const maxDays = items.length ? Math.max(...items.map(it => n(it.delivery_days))) : 0;
      const avgDisc = items.length ? Math.round(items.reduce((s, it) => s + n(it.discount_percentage), 0) / items.length) : 0;
      const awardDate = quote.updated_at ? new Date(quote.updated_at).toLocaleDateString('ar-EG') : '—';

      document.getElementById('items-summary').innerHTML = `
        <div class="kv-row"><span class="k">اسم المناقصة:</span><span class="v">${escapeHtml(quote.rfq.title)}</span></div>
        <div class="kv-row"><span class="k">سعر عرضك:</span><span class="v">${priceStr}$</span></div>
        <div class="kv-row"><span class="k">مدة التوريد:</span><span class="v">${maxDays} أيام</span></div>
        <div class="kv-row"><span class="k">نسبة الخصم:</span><span class="v">${avgDisc}%</span></div>
        <div class="kv-row"><span class="k">تاريخ اعتماد الترسية:</span><span class="v">${awardDate}</span></div>
      `;
    } catch (err) {
      showApiError(err.message || 'تعذّر تحميل نتيجة المناقصة');
    }
  })();
</script>
</body>
</html>
