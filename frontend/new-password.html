<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n-text="newPassword.title">كلمة مرور جديدة | PharmaLink</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
</head>
<body>
<a href="#main" class="skip-link">تخطي إلى المحتوى</a>

<main id="main" class="auth-wrap">
  <div class="auth-card">
    <a href="index.html" class="sb-logo">
      <img src="img/logo.png" alt="شعار PharmaLink">
    </a>

    <h1 class="auth-title" data-i18n-text="newPassword.heading">تعيين كلمة مرور جديدة</h1>

    <form id="newPassForm" novalidate>
      <div class="form-floating mb-3 position-relative">
        <input type="password" class="form-control" id="newPassword" placeholder="••••••••" required>
        <label for="newPassword" data-i18n-text="newPassword.field">كلمة مرور جديدة</label>
        <i class="bi bi-eye toggle-password" data-target="#newPassword"></i>
      </div>
      <div class="form-floating mb-4 position-relative">
        <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" required>
        <label for="confirmPassword" data-i18n-text="login.confirmPassword">تأكيد كلمة المرور</label>
        <i class="bi bi-eye toggle-password" data-target="#confirmPassword"></i>
      </div>
      <button type="submit" class="btn btn-pl w-100" data-i18n-text="common.submit">إرسال</button>
    </form>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script src="js/script.js"></script>
<script>
  document.getElementById('newPassForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const btn = this.querySelector('button[type="submit"]');
    const password = document.getElementById('newPassword').value;
    const password_confirmation = document.getElementById('confirmPassword').value;

    if (password !== password_confirmation) { showApiError(t('login.err.passwordMismatch')); return; }
    if (password.length < 8) { showApiError(t('newPassword.err.tooShort')); return; }

    btn.disabled = true;
    btn.textContent = t('newPassword.updatingBusy');

    try {
      await apiCall('POST', '/auth/reset-password', {
        identifier: localStorage.getItem('reset_identifier'),
        otp:        localStorage.getItem('reset_otp'),
        password,
        password_confirmation
      });
      localStorage.removeItem('reset_identifier');
      localStorage.removeItem('reset_otp');
      showApiSuccess(t('newPassword.success'));
      setTimeout(() => { window.location.href = 'login.html'; }, 1500);
    } catch(err) {
      showApiError(err.message || t('newPassword.err.failed'));
      btn.disabled = false;
      btn.textContent = t('common.submit');
    }
  });
</script>
</body>
</html>
