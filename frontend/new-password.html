<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كلمة مرور جديدة | PharmaLink</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a href="#main" class="skip-link">تخطي إلى المحتوى</a>

<main id="main" class="auth-wrap">
  <div class="auth-card">
    <a href="index.html" class="sb-logo">
      <img src="img/logo.svg" alt="شعار PharmaLink">
    </a>

    <h1 class="auth-title">تعيين كلمة مرور جديدة</h1>

    <form id="newPassForm" novalidate>
      <div class="form-floating mb-3 position-relative">
        <input type="password" class="form-control" id="newPassword" placeholder="••••••••" required>
        <label for="newPassword">كلمة مرور جديدة</label>
        <i class="bi bi-eye toggle-password position-absolute" data-target="#newPassword"
           style="left:1rem; top:1rem; cursor:pointer; color:#706E6E;"></i>
      </div>
      <div class="form-floating mb-4 position-relative">
        <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" required>
        <label for="confirmPassword">تأكيد كلمة المرور</label>
        <i class="bi bi-eye toggle-password position-absolute" data-target="#confirmPassword"
           style="left:1rem; top:1rem; cursor:pointer; color:#706E6E;"></i>
      </div>
      <button type="submit" class="btn btn-pl w-100">إرسال</button>
    </form>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/script.js"></script>
<script>
  document.getElementById('newPassForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const btn = this.querySelector('button[type="submit"]');
    const password = document.getElementById('newPassword').value;
    const password_confirmation = document.getElementById('confirmPassword').value;

    if (password !== password_confirmation) { showApiError('كلمتا المرور غير متطابقتين'); return; }
    if (password.length < 8) { showApiError('كلمة المرور يجب أن تكون 8 أحرف على الأقل'); return; }

    btn.disabled = true;
    btn.textContent = 'جارٍ التحديث...';

    try {
      await apiCall('POST', '/auth/reset-password', {
        identifier: localStorage.getItem('reset_identifier'),
        otp:        localStorage.getItem('reset_otp'),
        password,
        password_confirmation
      });
      localStorage.removeItem('reset_identifier');
      localStorage.removeItem('reset_otp');
      showApiSuccess('تم تحديث كلمة المرور بنجاح!');
      setTimeout(() => { window.location.href = 'login.html'; }, 1500);
    } catch(err) {
      showApiError(err.message || 'فشل تحديث كلمة المرور');
      btn.disabled = false;
      btn.textContent = 'إرسال';
    }
  });
</script>
</body>
</html>
