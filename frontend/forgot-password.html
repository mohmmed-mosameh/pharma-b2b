<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إعادة تعيين كلمة المرور | PharmaLink</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a href="#main" class="skip-link">تخطي إلى المحتوى</a>

<main id="main" class="auth-wrap">
  <div class="auth-card">
    <a href="index.html" class="sb-logo">
      <img src="img/logo.png" alt="شعار PharmaLink">
    </a>

    <h1 class="auth-title">إعادة تعيين كلمة المرور</h1>
    <p class="text-center text-muted mb-4">أدخل بريدك الإلكتروني لإرسال الكود</p>

    <form id="forgotForm" novalidate>
      <div class="form-floating mb-4">
        <input type="email" class="form-control" id="contact" placeholder="name@example.com" required>
        <label for="contact">البريد الإلكتروني</label>
      </div>
      <button type="submit" class="btn btn-pl w-100">إرسال</button>
    </form>

    <p class="auth-switch"><a href="login.html">رجوع لتسجيل الدخول</a></p>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script src="js/script.js"></script>
<script>
  document.getElementById('forgotForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const btn = this.querySelector('button[type="submit"]');
    const identifier = document.getElementById('contact').value.trim();

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(identifier)) {
      showApiError('الرجاء إدخال بريد إلكتروني صحيح');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'جارٍ الإرسال...';

    try {
      const res = await apiCall('POST', '/auth/forgot-password', { identifier });
      localStorage.setItem('reset_identifier', identifier);
      showApiSuccess(res.message || 'تم إرسال رمز التحقق');
      setTimeout(() => { window.location.href = 'otp-verify.html'; }, 1500);
    } catch(err) {
      showApiError(err.message || 'حدث خطأ، تحقق من البيانات');
      btn.disabled = false;
      btn.textContent = 'إرسال';
    }
  });
</script>
</body>
</html>
