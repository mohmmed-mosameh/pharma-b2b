<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جارٍ تسجيل الدخول... | PharmaLink</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="auth-wrap">
  <div class="auth-card text-center">
    <a href="index.html" class="sb-logo">
      <img src="img/logo.png" alt="شعار PharmaLink">
    </a>
    <h1 class="auth-title">جارٍ تسجيل الدخول...</h1>
    <p class="text-muted">لحظات من فضلك</p>
  </div>
</main>

<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script>
  (async function () {
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
      window.location.href = 'login.html?social_error=1';
      return;
    }

    localStorage.setItem('pharma_token', token);

    try {
      const res = await apiCall('GET', '/auth/me');
      localStorage.setItem('pharma_user', JSON.stringify(res.data));
      window.location.href = res.data.role === 'supplier' ? 'tenders.html' : 'dashboard.html';
    } catch (err) {
      localStorage.clear();
      window.location.href = 'login.html?social_error=1';
    }
  })();
</script>
</body>
</html>
