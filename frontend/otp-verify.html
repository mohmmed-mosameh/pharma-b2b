<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تأكيد الرمز | PharmaLink</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a href="#main" class="skip-link">تخطي إلى المحتوى</a>

<main id="main" class="auth-wrap">
  <div class="auth-card text-center">
    <a href="index.html" class="sb-logo">
      <img src="img/logo.png" alt="شعار PharmaLink">
    </a>

    <h1 class="auth-title">تم إرسال الكود بنجاح، قم بإدخاله</h1>

    <form id="otpForm" novalidate>
      <div class="otp-row">
        <input type="text" inputmode="numeric" maxlength="1" required>
        <input type="text" inputmode="numeric" maxlength="1" required>
        <input type="text" inputmode="numeric" maxlength="1" required>
        <input type="text" inputmode="numeric" maxlength="1" required>
      </div>

      <p class="mb-4"><a href="#" id="resendCode">أعد ارسال الرمز؟</a></p>

      <button type="submit" class="btn btn-pl w-100">إرسال</button>
    </form>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/script.js"></script>
<script>
  /* auto-advance OTP boxes */
  const otpInputs = document.querySelectorAll('.otp-row input');
  otpInputs.forEach((inp, i) => {
    inp.addEventListener('input', () => {
      if (inp.value.length >= 1 && otpInputs[i+1]) otpInputs[i+1].focus();
    });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !inp.value && otpInputs[i-1]) otpInputs[i-1].focus();
    });
  });

  /* OTP تحقق → POST /api/auth/verify-otp */
  document.getElementById('otpForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const btn = this.querySelector('button[type="submit"]');
    const otp = [...otpInputs].map(i => i.value).join('');
    const identifier = localStorage.getItem('reset_identifier');

    if (otp.length < 4) { showApiError('أدخل الرمز كاملاً'); return; }

    btn.disabled = true;
    btn.textContent = 'جارٍ التحقق...';

    try {
      await apiCall('POST', '/auth/verify-otp', { identifier, otp });
      localStorage.setItem('reset_otp', otp);
      showApiSuccess('رمز التحقق صحيح!');
      setTimeout(() => { window.location.href = 'new-password.html'; }, 1200);
    } catch(err) {
      showApiError(err.message || 'رمز غير صحيح أو منتهي الصلاحية');
      btn.disabled = false;
      btn.textContent = 'إرسال';
    }
  });

  /* إعادة إرسال */
  document.getElementById('resendCode').addEventListener('click', async function (e) {
    e.preventDefault();
    const identifier = localStorage.getItem('reset_identifier');
    if (!identifier) return;
    try {
      const res = await apiCall('POST', '/auth/forgot-password', { identifier });
      showApiSuccess(res.message || 'تم إعادة الإرسال');
    } catch(err) {
      showApiError('تعذّر إعادة الإرسال');
    }
  });
</script>
</body>
</html>
