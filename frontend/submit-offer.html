<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تقديم العرض | PharmaLink</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a href="#main" class="skip-link">تخطي إلى المحتوى</a>
<header id="mobileNav"></header>

<main id="main" class="pl-shell">

  <section class="pl-content">
    <div class="pl-card">
      <p class="pl-eyebrow">تقديم العرض</p>
      <h1 class="pl-page-title" id="v-title">تقديم عرض</h1>
      <p class="pl-page-sub">أدخل سعرك ومدة التوريد لكل صنف — يجب تسعير كل الأصناف المطلوبة</p>

      <form id="submitOfferForm" novalidate>
        <div id="items-form"></div>

        <div class="d-flex justify-content-between mt-4">
          <a href="tender-detail.html" id="back-link" class="btn btn-pl-ghost">رجوع</a>
          <button type="submit" class="btn btn-pl">إرسال العرض</button>
        </div>
      </form>

      <div id="offerSuccess" class="result-banner result-success d-none mt-4">
        <i class="bi bi-check-circle-fill"></i>
        <div>
          تم إرسال عرضك بنجاح
          <div><a href="track-status.html" class="btn-link-detail">متابعة حالة العرض</a></div>
        </div>
      </div>
    </div>
  </section>

  <aside class="pl-sidebar">
    <div class="sb-logo"><img src="img/logo.png" alt="شعار PharmaLink"></div>
    <nav>
      <a href="index.html">الرئيسية</a>
      <a href="tenders.html">المناقصات المتاحة</a>
      <a href="tender-detail.html">تفاصيل المناقصة</a>
      <a href="submit-offer.html" class="active">تقديم العرض</a>
      <a href="track-status.html">متابعة حالة المناقصات</a>
      <a href="tender-result.html">نتيجة المناقصة</a>
      <a href="#" class="logout-link">تسجيل الخروج</a>
    </nav>
  </aside>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/script.js"></script>
<script>
  requireRole('supplier');

  const rfqId = getRfqIdFromUrl();
  if (!rfqId) window.location.href = 'tenders.html';
  document.getElementById('back-link').href = 'tender-detail.html?id=' + rfqId;

  let rfqItems = [];

  (async function load() {
    try {
      const res = await apiCall('GET', '/rfqs/' + rfqId);
      const rfq = res.data;
      document.getElementById('v-title').textContent = 'تقديم عرض – ' + rfq.title;
      rfqItems = rfq.rfq_items || [];

      document.getElementById('items-form').innerHTML = rfqItems.map(item => `
        <div class="pl-card mb-3 offer-item-row" data-rfq-item-id="${item.id}">
          <h3 class="h6 fw-bold">${escapeHtml(item.product ? item.product.name : ('صنف #' + item.product_id))}${item.product && item.product.category ? ' <span class="text-muted small">(' + escapeHtml(item.product.category) + ')</span>' : ''} <span class="text-muted small">(الكمية المطلوبة: ${item.quantity})</span></h3>
          <div class="row g-3">
            <div class="col-md-3">
              <label class="form-label small">سعر الوحدة</label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="number" step="0.01" class="form-control item-price" min="0.01" required>
              </div>
            </div>
            <div class="col-md-3">
              <label class="form-label small">مدة التوريد (أيام)</label>
              <input type="number" class="form-control item-days" min="0" required>
            </div>
            <div class="col-md-3">
              <label class="form-label small">نسبة الخصم (اختياري)</label>
              <div class="input-group">
                <input type="number" class="form-control item-discount" min="0" max="100">
                <span class="input-group-text">%</span>
              </div>
            </div>
            <div class="col-md-3">
              <label class="form-label small">الكمية المتوفرة (اختياري)</label>
              <input type="number" class="form-control item-available" min="1" placeholder="${item.quantity}">
            </div>
            <div class="col-12">
              <label class="form-label small">ملاحظات (اختياري)</label>
              <input type="text" class="form-control item-notes">
            </div>
          </div>
        </div>
      `).join('');
    } catch (err) {
      showApiError(err.message || 'تعذّر تحميل بيانات المناقصة');
    }
  })();

  document.getElementById('submitOfferForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const btn = this.querySelector('button[type="submit"]');

    const items = Array.from(document.querySelectorAll('.offer-item-row')).map(row => ({
      rfq_item_id: Number(row.dataset.rfqItemId),
      unit_price: Number(row.querySelector('.item-price').value),
      delivery_days: Number(row.querySelector('.item-days').value),
      discount_percentage: row.querySelector('.item-discount').value ? Number(row.querySelector('.item-discount').value) : 0,
      available_qty: row.querySelector('.item-available').value ? Number(row.querySelector('.item-available').value) : null,
      notes: row.querySelector('.item-notes').value.trim() || null
    }));

    btn.disabled = true;
    try {
      await apiCall('POST', '/rfqs/' + rfqId + '/quotes', { items });
      document.getElementById('offerSuccess').classList.remove('d-none');
    } catch (err) {
      showApiError(err.message || 'تعذّر إرسال العرض');
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
